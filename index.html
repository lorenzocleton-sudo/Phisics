.wt { display:flex; align-items:center; gap:8px; margin:12px 0; } .wt input { width:6em; } .big { font-size:30px; font-weight:700; color:var(--acc2); }

const AU = 149597870.7, C_KMS = 299792.458, LY = 9460730472580.8, DEG = Math.PI / 180, J2000 = 2451545.0;
const OBL = 23.43928 * DEG;
const GM_SUN_AU = 2.9591220828559115e-4; // au^3/d^2
const GM_SUN = 132712440018; // km^3/s^2
const KGAUSS = 0.01720209895;
const MU_EARTHMOON = 81.30056;
const norm360 = d => ((d % 360) + 360) % 360;
const norm180 = d => { d = norm360(d); return d > 180 ? d - 360 : d; };

function solveKeplerE(M, e) { // M rad, elliptic
  M = Math.atan2(Math.sin(M), Math.cos(M));
  let E = e < 0.8 ? M : Math.PI * Math.sign(M || 1);
  for (let i = 0; i < 30; i++) { const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-12) break; }
  return E;
}
function solveKeplerH(M, e) { // hyperbolic
  let H = Math.sign(M) * Math.log(2 * Math.abs(M) / e + 1.8);
  for (let i = 0; i < 60; i++) { const d = (e * Math.sinh(H) - H - M) / (e * Math.cosh(H) - 1); H -= d; if (Math.abs(d) < 1e-12) break; }
  return H;
}
// orbital-plane coords -> reference frame via Omega, i, omega (radians)
function orient(xp, yp, O, i, w, out) {
  const cO = Math.cos(O), sO = Math.sin(O), ci = Math.cos(i), si = Math.sin(i), cw = Math.cos(w), sw = Math.sin(w);
  out[0] = (cw * cO - sw * sO * ci) * xp + (-sw * cO - cw * sO * ci) * yp;
  out[1] = (cw * sO + sw * cO * ci) * xp + (-sw * sO + cw * cO * ci) * yp;
  out[2] = (sw * si) * xp + (cw * si) * yp;
  return out;
}
// generic conic from (q, e, i, Om, w, tp) — angles deg, q AU, mu au^3/d^2 → km
function conicPos(q, e, iD, OD, wD, tp, jd, out, mu = GM_SUN_AU) {
  let xp, yp; const dt = jd - tp;
  if (e < 0.999999) {
    const a = q / (1 - e), n = Math.sqrt(mu / (a * a * a));
    const E = solveKeplerE(n * dt, e);
    xp = a * (Math.cos(E) - e); yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
  } else if (e > 1.000001) {
    const a = q / (e - 1), n = Math.sqrt(mu / (a * a * a));
    const H = solveKeplerH(n * dt, e);
    xp = a * (e - Math.cosh(H)); yp = a * Math.sqrt(e * e - 1) * Math.sinh(H);
  } else { // parabolic (Barker)
    const W = 3 * Math.sqrt(mu / (2 * q * q * q)) * dt, Y = Math.cbrt(W + Math.sqrt(W * W + 1)), s = Y - 1 / Y;
    xp = q * (1 - s * s); yp = 2 * q * s;
  }
  orient(xp, yp, OD * DEG, iD * DEG, wD * DEG, out);
  out[0] *= AU; out[1] *= AU; out[2] *= AU; return out;
}
// elements with mean anomaly at epoch (a AU, deg)
function elemPos(a, e, iD, OD, wD, M0, ep, jd, out) {
  const n = Math.sqrt(GM_SUN_AU / (a * a * a));
  const E = solveKeplerE(M0 * DEG + n * (jd - ep), e);
  orient(a * (Math.cos(E) - e), a * Math.sqrt(1 - e * e) * Math.sin(E), OD * DEG, iD * DEG, wD * DEG, out);
  out[0] *= AU; out[1] *= AU; out[2] *= AU; return out;
}
